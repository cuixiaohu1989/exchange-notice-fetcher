name: Update Trading Calendar

# 仅当 data/ 目录下的 Excel 被更新时触发（用户上传新交易年历后自动重建并部署）
on:
  push:
    paths:
      - "data/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build calendar JSON from Excel
        run: python scripts/build_calendar.py

      - name: Commit calendar.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.json
          git commit -m "Update trading calendar $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
