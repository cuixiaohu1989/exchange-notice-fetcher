name: Exchange Notice Crawler

on:
  schedule:
    # UTC 19:17 每天 = 北京时间 03:17 每天（凌晨低峰，避开美国晚间CI高峰和整点聚集）
    - cron: "17 19 * * *"
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run crawler
        run: python main.py --headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.HOME }}/.cache/ms-playwright

      - name: Write to Tencent Docs
        run: python scripts/write_to_tdocs_cloud.py
        env:
          TDOC_ACCESS_TOKEN: ${{ secrets.TDOC_ACCESS_TOKEN }}
          TDOC_CLIENT_ID: ${{ secrets.TDOC_CLIENT_ID }}
          TDOC_OPEN_ID: ${{ secrets.TDOC_OPEN_ID }}

      - name: Merge results into webpage data
        run: python scripts/merge_results.py

      - name: Commit results, state, and webpage data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json state/notices_state.json docs/data.json
          git commit -m "Daily crawl $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-results
          path: results.json
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
